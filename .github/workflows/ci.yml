name: "CI"

on:
    push:
        branches:
             - 'master'
    pull_request:
        branches:
            - '**'

permissions:
    contents: read

jobs:
    build:
        name: PHP ${{ matrix.php }}
        runs-on: 'ubuntu-latest'
        strategy:
            fail-fast: false
            matrix:
                php: [ '8.2', '8.3', '8.4', '8.5' ]
        steps:
            -   uses: actions/checkout@v7

            -   name: Setup PHP ${{ matrix.php }} and composer
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    coverage: none # disable xdebug, pcov
                    tools: composer:v2

            -   name: "Set composer cache directory"
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: "Cache composer"
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
                    restore-keys: ${{ runner.os }}-${{ matrix.php }}-composer-

            -   name: Install dependencies
                run: composer update

            -   name: Run CI
                run: vendor/bin/phpunit

    static-analysis:
        name: PHPStan
        runs-on: 'ubuntu-latest'
        steps:
            -   uses: actions/checkout@v7

            -   name: Setup PHP and composer
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2' # the lowest supported version, so its type errors surface too
                    coverage: none
                    tools: composer:v2

            -   name: "Set composer cache directory"
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: "Cache composer"
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-phpstan-composer-${{ hashFiles('composer.json') }}
                    restore-keys: ${{ runner.os }}-phpstan-composer-

            -   name: Install dependencies
                run: composer update

            -   name: Run PHPStan
                run: vendor/bin/phpstan analyse --no-progress
